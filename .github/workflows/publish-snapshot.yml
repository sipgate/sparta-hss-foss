name: Build, test and publish snapshot

on:
  push:
    branches: ["main"]
    paths:
      - "**/pom.xml"
      - "**/src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-central-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "25"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Guard
        id: version
        run: |
          set -euo pipefail
          version="$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout | tail -n1)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" != *-SNAPSHOT ]]; then
            echo "::notice::pom is at $version, a release; publish-release.yml handles this"
          fi

      - name: Build, Test, Sign and Deploy Snapshot to Maven Central
        if: endsWith(steps.version.outputs.value, '-SNAPSHOT')
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: ./mvnw -B -P deploy deploy
