name: Verify Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "25"
          cache: maven
      - name: Build and Test
        run: ./mvnw -B clean verify

  check-publishable:
    # Exercise the deploy profile so javadoc and sources breakage surfaces here,
    # not when a release tag is pushed. Tests already ran in check-pr, and
    # signing needs a key, so both stay off (gpg binds to verify, which
    # package never reaches).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "25"
          cache: maven
      - name: Build sources and javadoc jars
        run: ./mvnw -B -P deploy clean package -DskipTests

  check-docker:
    # Keep the Docker image buildable; publishing itself only happens on main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build docker image
        run: docker build --build-arg MVN_ADDITIONAL_ARGS=-DskipTests -t sparta-hss-foss:verify-pr .

  check-e2e:
    # Run the E2E suite: the containerized HSS is the unit under test, the
    # Diameter test agent in the runner container drives it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run E2E tests
        run: make run-e2e-tests
