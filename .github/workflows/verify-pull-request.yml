name: Verify Pull Request

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "25"
          cache: maven
      - name: Build and Test
        run: ./mvnw -B clean verify

  check-publishable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "25"
          cache: maven
      - name: Build sources and javadoc jars
        run: ./mvnw -B -P deploy clean package -DskipTests

  check-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build docker image
        run: docker build --build-arg MVN_ADDITIONAL_ARGS=-DskipTests -t sparta-hss-foss:verify-pr .

  check-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run E2E tests
        run: make run-e2e-tests

  check-docs:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build docs
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict --config-file docs/mkdocs.yml
