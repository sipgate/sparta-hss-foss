name: Publish Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["*"]

# Pages is served from the uploaded artifact, so nothing is pushed back to the
# repository: the token only needs to read the source.
permissions:
  contents: read
  pages: write
  id-token: write

# Pages keeps one live deployment; let a running one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install MkDocs
        run: pip install -r docs/requirements.txt
      - name: Build the site
        run: mkdocs build --strict --config-file docs/mkdocs.yml
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
