name: "Docker: Build and push to Docker Hub"

on:
  push:
    branches: ["main"]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
    paths:
      - "src/**"
      - "**/src/**"
      - "pom.xml"
      - "**/pom.xml"
      - "Dockerfile"
      - "docker/**"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-hub-publish
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "25"
          cache: maven
      - name: Set version tag
        id: version
        run: |
          TAG=$(./mvnw -B org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Refusing to publish: '$TAG' is not a valid Docker tag" >&2
            exit 1
          fi
          TAGS="sipgategmbh/sparta-hss-foss:$TAG"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="$TAGS,sipgategmbh/sparta-hss-foss:latest"
          fi
          echo "Publishing $TAGS"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          short-description: ${{ github.event.repository.description }}
          repository: sipgategmbh/sparta-hss-foss
