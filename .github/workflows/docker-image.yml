name: "Docker: Build and push to Docker Hub"

on:
  push:
    branches: ["main"]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
    paths:
      - "src/**"
      - "**/src/**"
      - "pom.xml"
      - "**/pom.xml"
      - "Dockerfile"
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set version tag
        id: version
        run: |
          TAG=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          TAGS="sipgategmbh/sparta-hss-foss:$TAG"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="$TAGS,sipgategmbh/sparta-hss-foss:latest"
          fi
          echo "Publishing $TAGS"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          short-description: ${{ github.event.repository.description }}
          repository: sipgategmbh/sparta-hss-foss
